[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-delay"
version = "0.1.0"
description = "Flight delay prediction from pre-departure features (Kaggle 2018-2022 data)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.6",
    "matplotlib>=3.8",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ipykernel", "kaggle"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
